name: Test

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-rust:
    name: Test libflo (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Build/crates/libflo

      - name: Install cargo tools
        uses: ./.github/actions/setup-rust-tools
        with:
          tools: just cargo-nextest

      - name: Run Rust tests
        run: just libflo test

  test-no-std:
    name: Test libflo (no_std / embedded)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install embedded target
        run: rustup target add thumbv8m.main-none-eabihf

      - name: Install cargo tools
        uses: ./.github/actions/setup-rust-tools
        with:
          tools: just cargo-nextest

      - name: Run no_std checks
        run: just libflo no_std


  test-reflo-no-std:
    name: Test reflo (no_std / embedded)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install embedded target
        run: rustup target add thumbv8m.main-none-eabihf

      - name: Install cargo tools
        uses: ./.github/actions/setup-rust-tools
        with:
          tools: just cargo-nextest

      - name: Run no_std checks
        run: just reflo no_std


  test-wasm:
    name: Test libflo (WASM/Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Build/crates/libflo

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: Tests/libflo/js/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('Tests/libflo/js/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install cargo tools
        uses: ./.github/actions/setup-rust-tools
        with:
          tools: just wasm-pack

      - name: Build WASM and run Jest tests
        run: just libflo test_wasm
