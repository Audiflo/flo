name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build demo WASM packages
        run: just demo build

      - name: Build documentation
        run: just docs build

      - name: Assemble Pages site
        run: |
          mkdir -p gh-pages-root/demo
          cp -R Docs/site/. gh-pages-root/
          cp -R Demo/. gh-pages-root/demo/
          rm -f gh-pages-root/demo/pkg-libflo/.gitignore gh-pages-root/demo/pkg-reflo/.gitignore
          cat > gh-pages-root/.gitignore <<'EOF'
          !demo/pkg-libflo/
          !demo/pkg-libflo/**
          !demo/pkg-reflo/
          !demo/pkg-reflo/**
          EOF
          if git status --porcelain --ignored -- gh-pages-root/demo/pkg-libflo/libflo_audio.js gh-pages-root/demo/pkg-reflo/reflo.js | grep -E '^!!'; then
            echo "wasm pkg file is git-ignored; refusing to publish" 1>&2
            exit 1
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-root
          publish_branch: gh-pages
