name: Build CLI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [created]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cli:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact: reflo-linux
            binary: flo
          - os: macos-latest
            artifact: reflo-macos
            binary: flo
          - os: windows-latest
            artifact: reflo-windows
            binary: flo.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Build

      - name: Install cargo tools
        uses: ./.github/actions/setup-rust-tools
        with:
          tools: just

      - name: Build flo CLI (release)
        run: cargo build --manifest-path Build/Cargo.toml -p reflo-cli --release

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: Build/target/release/${{ matrix.binary }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Build/target/release/${{ matrix.binary }}
          retention-days: 7

  build-cli-arm:
    name: Build CLI (macOS ARM64)
    runs-on: macos-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Build

      - name: Build for ARM64
        run: cargo build --manifest-path Build/Cargo.toml -p reflo-cli --release --target aarch64-apple-darwin

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: Build/target/aarch64-apple-darwin/release/flo

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: flo-macos-arm64
          path: Build/target/aarch64-apple-darwin/release/flo