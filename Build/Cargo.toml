[workspace]
resolver = "2"
members = [
    "crates/libflo",
    "crates/reflo",
    "crates/reflo-cli",
    "crates/flo-fixtures",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
authors = ["NellowTCS"]
license = "Apache-2.0"
repository = "https://github.com/Audiflo/flo"

[workspace.dependencies]

# Internal crates
libflo-audio = { path = "crates/libflo", version = "0.1.3", default-features = false }
reflo = { path = "crates/reflo", version = "0.1.3" }

serde = { version = "1", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
serde_bytes = { version = "0.11", default-features = false, features = ["alloc"] }
messagepack-serde = { version = "0.2.4", default-features = false, features = [
    "alloc",
] }

# Core and analysis
rustfft = { version = "6.2", default-features = false }
microfft = { version = "0.6", default-features = false, features = ["size-512"] }
num-complex = { version = "0.4", default-features = false }
libm = { version = "0.2", default-features = false }
blake3 = { version = "1.5", default-features = false }

# CLI and audio I/O
anyhow = { version = "1", default-features = false }
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }
clap = { version = "4", features = ["derive"] }
symphonia = { git = "https://github.com/NellowTCS/Symphonia", branch = "main", default-features = false, features = [
    "mp3",
    "flac",
    "ogg",
    "vorbis",
    "aac",
    "alac",
    "isomp4",
    "pcm",
    "wav",
    "all-meta",
] }

# WASM
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1.6"
web-sys = { version = "0.3", features = ["console"] }

# Speed optimizations
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# WASM optimizations
[profile.release.package."*"]
opt-level = 3
