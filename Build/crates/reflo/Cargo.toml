[package]
name = "reflo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Audio format converter for the flo audio format. Available as CLI and library with WebAssembly support"
keywords = ["audio", "codec", "compression", "wasm", "converter"]
categories = [
	"multimedia::audio",
	"multimedia::encoding",
	"command-line-utilities",
	"wasm",
]
readme = "README.md"
homepage = "https://github.com/Audiflo/flo"

[lib]
name = "reflo"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[test]]
name = "reflo_tests"
path = "../../../Tests/reflo/encode_decode_tests.rs"

[features]
default = ["std", "audio-io", "fft-rustfft"]
std = ["dep:chrono"]
audio-io = ["std", "dep:symphonia"]
fft-rustfft = ["libflo-audio/fft-rustfft"]
fft-microfft = ["libflo-audio/fft-microfft"]
wasm = [
	"audio-io",
	"fft-rustfft",
	"libflo-audio/wasm",
	"dep:wasm-bindgen",
	"dep:js-sys",
	"dep:console_error_panic_hook",
	"dep:serde-wasm-bindgen",
]

[dependencies]
libflo-audio = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true, default-features = false }
chrono = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }

# WASM
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
